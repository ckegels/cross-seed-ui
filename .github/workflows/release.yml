name: Release

# Push a tag like v0.2.0 to publish a release that `install.sh` / `cross-seed-ui update` can download.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build release tarball
        run: CSUI_VERSION="${GITHUB_REF_NAME#v}" node scripts/build.mjs --release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "cross-seed-ui $GITHUB_REF_NAME" \
            --notes-file <(sed -n "/^## ${GITHUB_REF_NAME#v}/,/^## /p" CHANGELOG.md | sed '$d')

  docker:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the app once (platform independent JavaScript)
        run: |
          npm ci
          CSUI_VERSION="${{ steps.v.outputs.version }}" node scripts/build.mjs
          mkdir -p image && cp -r dist docker image/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push ghcr.io/ckegels/cross-seed-ui
        uses: docker/build-push-action@v6
        with:
          context: image
          file: image/docker/Dockerfile.prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/ckegels/cross-seed-ui:latest
            ghcr.io/ckegels/cross-seed-ui:${{ steps.v.outputs.version }}
